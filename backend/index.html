<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Teste CORS</title>
</head>

<body>

    <h1>Teste de CORS</h1>
    <button id="buscar">Buscar dados da API</button>
    <p id="resultado"></p>

    <script>
        const botao = document.getElementById("buscar");
        const resultado = document.getElementById("resultado");

        botao.addEventListener("click", async () => {
            try {
                const resposta = await fetch("http://localhost:8000/api");
                const dados = await resposta.json();
                resultado.textContent = dados.mensagem;
                console.log(dados);
            } 
            catch (erro) {
                console.error("Erro:", erro);
                resultado.textContent = "Não foi possível acessar a API.";
            }});
    </script>

</body>

</html>
